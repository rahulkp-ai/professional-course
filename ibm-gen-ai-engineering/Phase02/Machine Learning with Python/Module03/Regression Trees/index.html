<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1,0">
        <title>NYC Taxi Tip Predictor & API</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
            body { font-family: 'Inter', sans-serif;}
            code, pre { font-family: 'JetBrains Mono', monospace; }
        </style>
    </head>
    <body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
        <!-- Navigation Bar-->
        <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 backdrop-blur z-50">
         <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🚕</span>
                <h1 class="font-bold text-lg text-amber-400">NYC Taxi Tip Predictor</h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span id="health-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-slate-500"></span> Checking API...
                </span>
                <a href="/docs" target="_blank" class="text-slate-300 hover:text-amber-400 transition font-medium">Swagger Docs ↗</a>
            </div>
         </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
      <h2 class="text-xl font-bold text-slate-100 mb-1">Trip Parameters</h2>
      <p class="text-xs text-slate-400 mb-6">Adjust trip details below to estimate the predicted driver tip.</p>

      <form id="prediction-form" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Fare Amount ($)</label>
            <input type="number" id="fare_amount" step="0.5" value="12.50" min="0" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-amber-400 font-semibold focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Trip Distance (miles)</label>
            <input type="number" id="trip_distance" step="0.1" value="2.5" min="0" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Payment Type</label>
            <select id="payment_type" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
              <option value="1">1 - Credit Card</option>
              <option value="2">2 - Cash</option>
              <option value="3">3 - No Charge</option>
              <option value="4">4 - Dispute</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Passengers</label>
            <input type="number" id="passenger_count" value="1" min="1" max="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Ratecode ID</label>
            <select id="RatecodeID" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
              <option value="1">1 - Standard</option>
              <option value="2">2 - JFK</option>
              <option value="3">3 - Newark</option>
              <option value="4">4 - Nassau/Westchester</option>
              <option value="5">5 - Negotiated</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Pickup Location ID (PULocationID)</label>
            <input type="number" id="PULocationID" value="142" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Dropoff Location ID (DOLocationID)</label>
            <input type="number" id="DOLocationID" value="236" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-4 gap-3 pt-2">
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1">Vendor ID</label>
            <input type="number" id="VendorID" value="1" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-100">
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1">MTA Tax ($)</label>
            <input type="number" id="mta_tax" step="0.1" value="0.50" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-100">
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1">Tolls ($)</label>
            <input type="number" id="tolls_amount" step="0.5" value="0.00" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-100">
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1">Surcharge ($)</label>
            <input type="number" id="improvement_surcharge" step="0.1" value="0.30" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-100">
          </div>
        </div>

        <button type="button" onclick="makePrediction()" class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-lg transition duration-200 shadow-lg shadow-amber-500/10">
          Calculate Predicted Tip
        </button>
      </form>
    </div>

        <!-- Results & Output Column -->
    <div class="lg:col-span-5 flex flex-col gap-6">

      <!-- Display Card -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl relative overflow-hidden">
        <div class="absolute -right-8 -bottom-8 text-9xl opacity-5 select-none">🚕</div>
        
        <h3 class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-4">Prediction Output</h3>
        
        <div class="mb-6">
          <span class="text-xs text-slate-400">Estimated Driver Tip</span>
          <div id="tip-amount" class="text-5xl font-extrabold text-amber-400 mt-1">$0.00</div>
        </div>

        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-800">
          <div>
            <span class="text-xs text-slate-400 block">Tip Percentage</span>
            <span id="tip-percentage" class="text-lg font-bold text-slate-200">0.0%</span>
          </div>
          <div>
            <span class="text-xs text-slate-400 block">Total Est. Cost</span>
            <span id="total-cost" class="text-lg font-bold text-slate-200">$0.00</span>
          </div>
        </div>
      </div>

      <!-- JSON API Output Card -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs uppercase tracking-wider font-semibold text-slate-400">API Response Payload</h3>
          <span class="text-[10px] text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded">200 OK</span>
        </div>
        <pre id="json-output" class="bg-slate-950 border border-slate-800/80 rounded-lg p-4 text-xs text-amber-300/90 overflow-x-auto flex-1 font-mono">{ "status": "awaiting request" }</pre>
      </div>

    </div>
  </main>

    <script>
    const API_URL = "http://127.0.0.1:8000";

    async function checkHealth() {
      const badge = document.getElementById("health-badge");
      try {
        const res = await fetch(`${API_URL}/health`);
        if (res.ok) {
          badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-950 border border-emerald-800 text-emerald-400 flex items-center gap-1.5";
          badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> API Online`;
        } else {
          throw new Error();
        }
      } catch {
        badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-red-950 border border-red-800 text-red-400 flex items-center gap-1.5";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> API Offline`;
      }
    }

    async function makePrediction() {
      const payload = {
        VendorID: parseFloat(document.getElementById("VendorID").value),
        passenger_count: parseFloat(document.getElementById("passenger_count").value),
        trip_distance: parseFloat(document.getElementById("trip_distance").value),
        RatecodeID: parseFloat(document.getElementById("RatecodeID").value),
        PULocationID: parseFloat(document.getElementById("PULocationID").value),
        DOLocationID: parseFloat(document.getElementById("DOLocationID").value),
        payment_type: parseFloat(document.getElementById("payment_type").value),
        fare_amount: parseFloat(document.getElementById("fare_amount").value),
        mta_tax: parseFloat(document.getElementById("mta_tax").value),
        tolls_amount: parseFloat(document.getElementById("tolls_amount").value),
        improvement_surcharge: parseFloat(document.getElementById("improvement_surcharge").value)
      };

      try {
        const response = await fetch(`${API_URL}/predict`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        document.getElementById("json-output").textContent = JSON.stringify(data, null, 2);

        if (response.ok) {
          document.getElementById("tip-amount").textContent = `$${data.predicted_tip.toFixed(2)}`;
          document.getElementById("tip-percentage").textContent = `${data.tip_percentage}%`;
          document.getElementById("total-cost").textContent = `$${data.total_estimated_cost.toFixed(2)}`;
        }
      } catch (err) {
        document.getElementById("json-output").textContent = JSON.stringify({ error: err.message }, null, 2);
      }
    }

    // Run initial health check and prediction on load
    checkHealth();
    makePrediction();
  </script>
  
    </body>
</html>
